apiVersion: v1
kind: Pod
metadata:
  name: lab07-secret-demo
spec:
  containers:
  - name: demo
    image: busybox:1.36
    command: ["sleep", "3600"]
    env:
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: lab07-db-secret
          key: DB_PASSWORD
    volumeMounts:
    - name: secret-volume
      mountPath: /etc/secrets
      readOnly: true
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
  volumes:
  - name: secret-volume
    secret:
      secretName: lab07-db-secret
